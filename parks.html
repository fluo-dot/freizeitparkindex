<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freizeitpark Übersicht</title>
  <style>
    /* Grundlegendes Layout & Styling */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }

    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #2c3e50; font-size: 2.2rem; margin-bottom: 10px; }
    header p { color: #666; }

    /* Suchleiste und Filter-Steuerung */
    .controls { max-width: 1100px; margin: 0 auto 30px auto; display: flex; gap: 15px; flex-wrap: wrap; }
    .controls input, .controls select {
      padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; flex: 1; min-width: 200px;
    }

    /* Grid Layout für die Park-Karten */
    .park-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Park Card Design */
    .park-card {
      background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column;
    }
    .park-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }

    .park-img { width: 100%; height: 180px; object-fit: cover; background-color: #e0e0e0; }
    .park-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    
    .park-title { font-size: 1.4rem; color: #2c3e50; margin-bottom: 5px; }
    .park-location { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 15px; font-weight: 500; }
    .park-desc { font-size: 0.95rem; color: #555; line-height: 1.4; margin-bottom: 20px; flex-grow: 1; }

    /* Buttons */
    .button-group { display: flex; gap: 10px; }
    .btn {
      flex: 1; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none;
      font-weight: bold; font-size: 0.9rem; transition: background-color 0.2s;
    }
    .btn-primary { background-color: #3498db; color: white; }
    .btn-primary:hover { background-color: #2980b9; }
    .btn-secondary { background-color: #2ecc71; color: white; }
    .btn-secondary:hover { background-color: #27ae60; }

    .loading, .error { text-align: center; font-size: 1.2rem; color: #666; margin-top: 20px; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>

  <header>
    <h1>Freizeitparks Entdecken</h1>
    <p>Finde Infos, Fast-Pass-Details und Live-Wartezeiten für deine Lieblingsparks!</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Parkname oder Ort suchen...">
    <select id="countryFilter">
      <option value="">Alle Länder</option>
    </select>
  </div>

  <div id="loading" class="loading">Lade Parks aus 'parks.csv'...</div>
  <div class="park-grid" id="parkGrid"></div>

  <script>
    let alleParks = [];

    // Robuster CSV-Parser für Dateien mit Kommas in Anführungszeichen
    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length === 0) return [];

      // Funktion zum Aufteilen einer CSV-Zeile
      function splitLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim());
        return result;
      }

      const headers = splitLine(lines[0]);

      return lines.slice(1).map(line => {
        const values = splitLine(line);
        let rowObject = {};
        headers.forEach((header, index) => {
          rowObject[header] = values[index] || '';
        });
        return rowObject;
      });
    }

    // CSV-Datei vom gleichen Server/GitHub-Ordner laden
    async function ladeParks() {
      try {
        const response = await fetch('parks.csv');
        if (!response.ok) {
          throw new Error('Datei parks.csv konnte nicht gefunden werden.');
        }
        
        const csvText = await response.text();
        alleParks = parseCSV(csvText);
        
        document.getElementById('loading').style.display = 'none';
        
        fuelleLaenderFilter(alleParks);
        zeigeParks(alleParks);

      } catch (error) {
        console.error("Fehler beim Laden der CSV-Datei:", error);
        document.getElementById('loading').innerText = "Fehler: Die Datei 'parks.csv' konnte nicht geladen werden.";
        document.getElementById('loading').classList.add('error');
      }
    }

    // Länder im Dropdown befüllen
    function fuelleLaenderFilter(parks) {
      const laender = [...new Set(parks.map(p => p.land).filter(l => l))];
      const select = document.getElementById('countryFilter');
      
      laender.sort().forEach(land => {
        const option = document.createElement('option');
        option.value = land;
        option.textContent = land;
        select.appendChild(option);
      });
    }

    // Karten im HTML rendern
    function zeigeParks(parks) {
      const grid = document.getElementById('parkGrid');
      grid.innerHTML = '';

      if (parks.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Keine Parks gefunden.</p>';
        return;
      }

      parks.forEach(park => {
        const beschreibungFormatted = park.beschreibung ? park.beschreibung.replace(/&lt;br&gt;|<br>/g, '<br>') : '';

        const card = document.createElement('div');
        card.className = 'park-card';
        card.innerHTML = `
          <img class="park-img" src="${park.bild_url || 'https://via.placeholder.com/400x200?text=Kein+Bild'}" alt="${park.name}">
          <div class="park-body">
            <h2 class="park-title">${park.name}</h2>
            <div class="park-location">📍 ${park.ort ? park.ort + ', ' : ''}${park.land}</div>
            <p class="park-desc">${beschreibungFormatted}</p>
            <div class="button-group">
              <a href="park-detail.html?id=${park.id}" class="btn btn-primary">Park Info</a>
              <a href="wartezeiten.html?id=${park.id}" class="btn btn-secondary">Wartezeiten</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter-Funktion
    function filterParks() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const selectedCountry = document.getElementById('countryFilter').value;

      const gefiltert = alleParks.filter(park => {
        const matchesSearch = (park.name && park.name.toLowerCase().includes(searchTerm)) || 
                              (park.ort && park.ort.toLowerCase().includes(searchTerm));
        const matchesCountry = selectedCountry === '' || park.land === selectedCountry;

        return matchesSearch && matchesCountry;
      });

      zeigeParks(gefiltert);
    }

    document.getElementById('searchInput').addEventListener('input', filterParks);
    document.getElementById('countryFilter').addEventListener('change', filterParks);

    // Initiales Laden
    ladeParks();
  </script>
</body>
</html>
