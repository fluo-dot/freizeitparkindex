<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freizeitpark Übersicht</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }

    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #2c3e50; font-size: 2.2rem; margin-bottom: 10px; }
    header p { color: #666; }

    .controls { max-width: 1100px; margin: 0 auto 30px auto; display: flex; gap: 15px; flex-wrap: wrap; }
    .controls input, .controls select {
      padding: 12px 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; flex: 1; min-width: 200px;
    }

    .park-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Die Karte ist jetzt ein Link */
    .park-card {
      background: white; 
      border-radius: 12px; 
      overflow: hidden; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s; 
      display: flex; 
      flex-direction: column;
      text-decoration: none; /* entfernt Unterstreichung des Links */
      color: inherit; /* Behält die Textfarben bei */
      cursor: pointer;
    }
    .park-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }

    .park-img { width: 100%; height: 180px; object-fit: cover; background-color: #e0e0e0; }
    .park-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    
    .park-title { font-size: 1.4rem; color: #2c3e50; margin-bottom: 5px; }
    .park-location { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 15px; font-weight: 500; }

    .button-group { margin-top: auto; }
    .btn {
      display: block; width: 100%; text-align: center; padding: 12px; border-radius: 6px;
      font-weight: bold; font-size: 0.95rem; transition: background-color 0.2s;
    }
    .btn-primary { background-color: #3498db; color: white; }
    .park-card:hover .btn-primary { background-color: #2980b9; }

    .loading, .error { text-align: center; font-size: 1.2rem; color: #666; margin-top: 20px; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>

  <header>
    <h1>Freizeitparks Entdecken</h1>
    <p>Finde Infos und Fast-Pass-Details für deine Lieblingsparks!</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Parkname oder Ort suchen...">
    <select id="countryFilter">
      <option value="">Alle Länder</option>
    </select>
  </div>

  <div id="loading" class="loading">Lade Parks aus 'parks.csv'...</div>
  <div class="park-grid" id="parkGrid"></div>

  <script>
    let alleParks = [];

    // Robuster CSV-Parser für mehrzeilige Werte in Anführungszeichen
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            currentCell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentCell.trim());
          if (currentRow.some(cell => cell !== '')) rows.push(currentRow);
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }
      if (currentCell !== '' || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        if (currentRow.some(cell => cell !== '')) rows.push(currentRow);
      }

      if (rows.length === 0) return [];

      const headers = rows[0];
      return rows.slice(1).map(row => {
        let obj = {};
        headers.forEach((header, index) => {
          obj[header] = row[index] || '';
        });
        return obj;
      });
    }

    // Funktion zum Erstellen des korrekten Pfads im "Bilder/" Ordner
    function getBildPfad(dateiname) {
      if (!dateiname || dateiname.trim() === '') {
        return 'https://via.placeholder.com/400x200?text=Kein+Bild';
      }
      dateiname = dateiname.trim();
      
      // Falls bereits eine vollständige URL oder 'Bilder/' enthalten ist
      if (dateiname.startsWith('http://') || dateiname.startsWith('https://') || dateiname.startsWith('Bilder/')) {
        return dateiname;
      }
      
      // Ansonsten Ordner 'Bilder/' voranstellen
      return `Bilder/${dateiname}`;
    }

    async function ladeParks() {
      try {
        const response = await fetch('parks.csv');
        if (!response.ok) throw new Error('Datei parks.csv konnte nicht gefunden werden.');
        
        const csvText = await response.text();
        alleParks = parseCSV(csvText);
        
        document.getElementById('loading').style.display = 'none';
        
        fuelleLaenderFilter(alleParks);
        zeigeParks(alleParks);

      } catch (error) {
        console.error("Fehler beim Laden der CSV-Datei:", error);
        document.getElementById('loading').innerText = "Fehler: Die Datei 'parks.csv' konnte nicht geladen werden.";
        document.getElementById('loading').classList.add('error');
      }
    }

    function fuelleLaenderFilter(parks) {
      const laender = [...new Set(parks.map(p => p.land).filter(l => l))];
      const select = document.getElementById('countryFilter');
      
      laender.sort().forEach(land => {
        const option = document.createElement('option');
        option.value = land;
        option.textContent = land;
        select.appendChild(option);
      });
    }

    function zeigeParks(parks) {
      const grid = document.getElementById('parkGrid');
      grid.innerHTML = '';

      if (parks.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Keine Parks gefunden.</p>';
        return;
      }

      const placeholderImg = 'https://via.placeholder.com/400x200?text=Kein+Bild';

      parks.forEach(park => {
        const bildPfad = getBildPfad(park.bild_url);

        // Die gesamte Karte ist nun ein <a> Tag
        const card = document.createElement('a');
        card.className = 'park-card';
        card.href = `park-detail.html?id=${park.id}`;
        card.innerHTML = `
          <img class="park-img" 
               src="${bildPfad}" 
               alt="${park.name}" 
               onerror="this.onerror=null; this.src='${placeholderImg}';">
          <div class="park-body">
            <h2 class="park-title">${park.name}</h2>
            <div class="park-location">📍 ${park.ort ? park.ort + ', ' : ''}${park.land}</div>
            <div class="button-group">
              <span class="btn btn-primary">Park Info & Details</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterParks() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const selectedCountry = document.getElementById('countryFilter').value;

      const gefiltert = alleParks.filter(park => {
        const matchesSearch = (park.name && park.name.toLowerCase().includes(searchTerm)) || 
                              (park.ort && park.ort.toLowerCase().includes(searchTerm));
        const matchesCountry = selectedCountry === '' || park.land === selectedCountry;

        return matchesSearch && matchesCountry;
      });

      zeigeParks(gefiltert);
    }

    document.getElementById('searchInput').addEventListener('input', filterParks);
    document.getElementById('countryFilter').addEventListener('change', filterParks);

    ladeParks();
  </script>
</body>
</html>
