<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Wartezeiten - FreizeitparkIndex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f172a;
      --primary-accent: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 10px 20px -5px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    nav { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: white; font-size: 1.3rem; font-weight: 800; text-decoration: none; }
    .btn-back { background: rgba(255,255,255,0.1); color: white; text-decoration: none; padding: 8px 16px; border-radius: 30px; font-size: 0.88rem; font-weight: 600; transition: background 0.2s; }
    .btn-back:hover { background: rgba(255,255,255,0.25); }

    .container { max-width: 1200px; margin: 30px auto; padding: 0 24px; flex-grow: 1; width: 100%; }
    .page-header { text-align: center; margin-bottom: 24px; }
    .page-header h1 { font-size: 2.2rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }

    .opening-banner { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 12px 20px; border-radius: var(--radius-md); text-align: center; font-weight: 600; font-size: 0.95rem; margin-bottom: 24px; }

    .controls { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .controls input, .controls select { padding: 12px 18px; border: 1px solid #cbd5e1; border-radius: var(--radius-md); font-size: 0.95rem; outline: none; flex: 1; min-width: 200px; }

    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--card-bg); padding: 20px; border-radius: var(--radius-lg); border: 1px solid #e2e8f0; box-shadow: var(--shadow-sm); text-align: center; }
    .stat-number { font-size: 2rem; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }

    .attraction-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }

    .ride-card {
      background: var(--card-bg); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm);
      border: 1px solid #e2e8f0; border-left: 6px solid #cbd5e1; display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 0.2s;
    }
    .ride-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .ride-name { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .ride-meta { display: flex; justify-content: space-between; align-items: center; }

    .status-badge { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .status-open { color: #10b981; }
    .status-closed { color: #ef4444; }

    .time-badge { padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 0.95rem; color: white; }
    .badge-green { background-color: #10b981; }
    .badge-yellow { background-color: #f59e0b; }
    .badge-red { background-color: #ef4444; }
    .badge-closed { background-color: #94a3b8; }

    .loading, .error { text-align: center; padding: 60px 20px; font-size: 1.1rem; color: var(--text-muted); }
    footer { background-color: var(--primary); color: #64748b; text-align: center; padding: 24px; margin-top: auto; font-size: 0.9rem; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="index.html" class="logo">🎡 FreizeitparkIndex</a>
      <a id="backToDetail" href="parks.html" class="btn-back">← Zurück zum Park</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-header">
      <h1 id="parkTitle">Live Wartezeiten</h1>
    </div>

    <div id="openingBanner" class="opening-banner" style="display: none;"></div>

    <div class="stats-bar" id="statsBar" style="display: none;">
      <div class="stat-card">
        <div class="stat-number" id="statOpen">0</div>
        <div class="stat-label">Geöffnet</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statAvg">0 min</div>
        <div class="stat-label">Ø Wartezeit</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statClosed">0</div>
        <div class="stat-label">Geschlossen</div>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 Attraktion suchen...">
      <select id="statusFilter">
        <option value="all">Alle Attraktionen</option>
        <option value="open">Nur Geöffnete</option>
        <option value="closed">Nur Geschlossene</option>
      </select>
      <select id="sortSelect">
        <option value="wait-desc">Wartezeit (Höchste)</option>
        <option value="wait-asc">Wartezeit (Niedrigste)</option>
        <option value="name-asc">Name (A-Z)</option>
      </select>
    </div>

    <div id="loading" class="loading">Abrufen der Live-Daten...</div>
    <div id="attractionGrid" class="attraction-grid"></div>
  </main>

  <footer>
    <p>FreizeitparkIndex - Powered by <a href="https://wartezeiten.app" target="_blank" rel="noopener">Wartezeiten.APP</a></p>
  </footer>

  <script>
    let alleAttraktionen = [];

    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length === 0) return [];
      function splitLine(line) {
        const result = []; let current = ''; let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
            else { inQuotes = !inQuotes; }
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim()); current = '';
          } else { current += char; }
        }
        result.push(current.trim()); return result;
      }
      const headers = splitLine(lines[0]);
      return lines.slice(1).map(line => {
        const values = splitLine(line);
        let row = {}; headers.forEach((h, idx) => { row[h] = values[idx] || ''; });
        return row;
      });
    }

    async function initialisiereWartezeiten() {
      const urlParams = new URLSearchParams(window.location.search);
      const parkId = urlParams.get('id');

      if (!parkId) { zeigeFehler("Keine Park-ID vorhanden."); return; }

      document.getElementById('backToDetail').href = `park-detail.html?id=${parkId}`;

      try {
        const csvRes = await fetch('parks.csv');
        if (!csvRes.ok) throw new Error("parks.csv konnte nicht geladen werden.");
        
        const csvText = await csvRes.text();
        const parks = parseCSV(csvText);
        const park = parks.find(p => p.id === parkId);

        if (!park || !park.api_park_id) {
          zeigeFehler("Keine gültige API-ID für diesen Park hinterlegt."); return;
        }

        document.getElementById('parkTitle').innerText = `${park.name} – Live Status`;
        document.title = `Wartezeiten ${park.name} - FreizeitparkIndex`;

        ladeOeffnungszeiten(park.api_park_id);
        await ladeApiDaten(park.api_park_id);

      } catch (err) {
        console.error(err);
        zeigeFehler("Fehler beim Laden der Live-Wartezeiten.");
      }
    }

    async function ladeOeffnungszeiten(uuid) {
      try {
        const res = await fetch(`https://api.wartezeiten.app/v1/openingtimes?park=${uuid}&language=de`);
        if (res.ok) {
          const data = await res.json();
          const heute = Array.isArray(data) ? data[0] : (data.openingtimes ? data.openingtimes[0] : null);
          const banner = document.getElementById('openingBanner');
          if (heute) {
            banner.innerHTML = `📅 Öffnungszeiten heute: <strong>${heute.opens || heute.open} - ${heute.closes || heute.close} Uhr</strong>`;
            banner.style.display = 'block';
          }
        }
      } catch (e) {
        console.log("Öffnungszeiten konnten nicht abgerufen werden.");
      }
    }

    async function ladeApiDaten(uuid) {
      try {
        // Query-Parameter statt benutzerdefinierte Header
        const response = await fetch(`https://api.wartezeiten.app/v1/waitingtimes?park=${uuid}&language=de`);

        if (!response.ok) throw new Error(`API Fehler (${response.status})`);

        const data = await response.json();
        alleAttraktionen = Array.isArray(data) ? data : (data.items || data.waitingtimes || []);

        if (alleAttraktionen.length === 0) {
          zeigeFehler("Derzeit sind keine Attraktionsdaten verfügbar."); return;
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('statsBar').style.display = 'grid';

        aktualisiereStatistiken(alleAttraktionen);
        filterUndZeigeAttraktionen();

      } catch (err) {
        console.error(err);
        zeigeFehler("Wartezeiten konnten nicht von der API empfangen werden.");
      }
    }

    function istAttraktionGeoffnet(item) {
      const status = (item.status || '').toLowerCase();
      if (status === 'closed' || status === 'geschlossen' || item.isOpen === false) return false;
      if (status === 'open' || status === 'opened' || item.isOpen === true) return true;
      return item.wait !== undefined && item.wait !== null && item.wait >= 0;
    }

    function aktualisiereStatistiken(items) {
      let offenCount = 0;
      let geschlossenCount = 0;
      let gesamtWartezeit = 0;

      items.forEach(item => {
        const geoffnet = istAttraktionGeoffnet(item);
        const wartezeit = Number(item.wait || item.waitTime || item.waitingtime || 0);

        if (geoffnet) {
          offenCount++;
          gesamtWartezeit += wartezeit;
        } else {
          geschlossenCount++;
        }
      });

      const avg = offenCount > 0 ? Math.round(gesamtWartezeit / offenCount) : 0;

      document.getElementById('statOpen').innerText = offenCount;
      document.getElementById('statClosed').innerText = geschlossenCount;
      document.getElementById('statAvg').innerText = `${avg} min`;
    }

    function filterUndZeigeAttraktionen() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const sortValue = document.getElementById('sortSelect').value;

      let gefiltert = alleAttraktionen.filter(item => {
        const name = (item.name || item.title || '').toLowerCase();
        const matchesSearch = name.includes(searchTerm);
        
        const geoffnet = istAttraktionGeoffnet(item);
        let matchesStatus = true;
        if (statusFilter === 'open') matchesStatus = geoffnet;
        if (statusFilter === 'closed') matchesStatus = !geoffnet;

        return matchesSearch && matchesStatus;
      });

      gefiltert.sort((a, b) => {
        const nameA = a.name || a.title || '';
        const nameB = b.name || b.title || '';
        const waitA = istAttraktionGeoffnet(a) ? Number(a.wait || a.waitTime || a.waitingtime || 0) : -1;
        const waitB = istAttraktionGeoffnet(b) ? Number(b.wait || b.waitTime || b.waitingtime || 0) : -1;

        if (sortValue === 'wait-desc') return waitB - waitA;
        if (sortValue === 'wait-asc') return waitA - waitB;
        if (sortValue === 'name-asc') return nameA.localeCompare(nameB);
        return 0;
      });

      renderAttraktionen(gefiltert);
    }

    function renderAttraktionen(items) {
      const grid = document.getElementById('attractionGrid');
      grid.innerHTML = '';

      if (items.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Keine Attraktionen gefunden.</p>';
        return;
      }

      items.forEach(item => {
        const name = item.name || item.title || 'Unbenannte Attraktion';
        const geoffnet = istAttraktionGeoffnet(item);
        const wartezeit = item.wait ?? item.waitTime ?? item.waitingtime ?? 0;

        let badgeClass = 'badge-closed';
        let badgeText = 'Geschlossen';
        let borderStyle = '#94a3b8';

        if (geoffnet) {
          const min = Number(wartezeit);
          badgeText = `${min} min`;

          if (min <= 15) {
            badgeClass = 'badge-green'; borderStyle = '#10b981';
          } else if (min <= 40) {
            badgeClass = 'badge-yellow'; borderStyle = '#f59e0b';
          } else {
            badgeClass = 'badge-red'; borderStyle = '#ef4444';
          }
        }

        const card = document.createElement('div');
        card.className = 'ride-card';
        card.style.borderLeftColor = borderStyle;
        card.innerHTML = `
          <div class="ride-name">${name}</div>
          <div class="ride-meta">
            <span class="status-badge ${geoffnet ? 'status-open' : 'status-closed'}">
              ${geoffnet ? '● Geöffnet' : '○ Geschlossen'}
            </span>
            <span class="time-badge ${badgeClass}">${badgeText}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function zeigeFehler(msg) {
      const loading = document.getElementById('loading');
      loading.innerText = msg; loading.className = 'error';
    }

    document.getElementById('searchInput').addEventListener('input', filterUndZeigeAttraktionen);
    document.getElementById('statusFilter').addEventListener('change', filterUndZeigeAttraktionen);
    document.getElementById('sortSelect').addEventListener('change', filterUndZeigeAttraktionen);

    initialisiereWartezeiten();
  </script>
</body>
</html>
